
services:
  postgres:
    image: postgres:15.3-alpine
    container_name: dantech-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dantech
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  prisma-migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - postgres
    command: sh -c "npm install && npx prisma db push && npx prisma generate"


  redis:
    image: redis:7.2-alpine
    container_name: dantech-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  
  dantech-server:
    container_name: dantech-server
    build:
      context: .     
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL =""
      - PORT = 5000
      - KINDE_ISSUER_URL=https://dantechcomputers.kinde.com
      - WHATSAPP_ACCESS_TOKEN=""
      - WHATSAPP_PHONE_NUMBER_ID=""
      - WHATSAPP_GRAPH_API_VERSION=v25.0
      - NOTIFICATION_TRANSPORT=whatsapp
      - NOTIFICATION_CREDENTIALS_KEY=""
    ports:
      - "5000:5000"
    init: true
    restart: unless-stopped
      

